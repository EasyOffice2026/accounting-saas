app = "mudawwarah-wa"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  AUTH_DIR = "/data/auth"

[[mounts]]
  source = "wa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
